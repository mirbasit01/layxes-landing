<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .mark { stroke: #ffffff; stroke-width: 10; fill: none; stroke-linecap: square; stroke-linejoin: miter; }
    </style>
  </defs>

  <!-- Square frame -->
  <rect x="10" y="10" width="180" height="180" fill="none" stroke="#ffffff" stroke-width="3"/>

  <!-- Geometric L + X monogram -->
  <g class="mark">
    <!-- L shape (left, bold) -->
    <path d="M 55,45 L 55,140 L 115,140"/>
    <!-- X formed by two diagonals crossing through the L's negative space, offset to the right -->
    <path d="M 100,55 L 150,135"/>
    <path d="M 150,55 L 100,135"/>
  </g>
</svg>
