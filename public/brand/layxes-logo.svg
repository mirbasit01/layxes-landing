<svg viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .word { font-family: 'Helvetica Neue', Arial, sans-serif; font-weight: 700; fill: #ffffff; }
      .mark { stroke: #ffffff; stroke-width: 9; fill: none; stroke-linecap: square; stroke-linejoin: miter; }
    </style>
  </defs>

  <!-- Icon: square frame with LX monogram -->
  <g transform="translate(10,10)">
    <rect x="0" y="0" width="200" height="200" fill="none" stroke="#ffffff" stroke-width="3"/>
    <g class="mark" transform="translate(0,0)">
      <path d="M 55,45 L 55,140 L 115,140"/>
      <path d="M 100,55 L 150,135"/>
      <path d="M 150,55 L 100,135"/>
    </g>
  </g>

  <!-- Divider line -->
  <line x1="248" y1="30" x2="248" y2="190" stroke="#ffffff" stroke-width="1.5" opacity="0.4"/>

  <!-- Wordmark -->
  <text x="285" y="140" class="word" font-size="78" letter-spacing="5">LAYXES</text>
  <circle cx="770" cy="64" r="7" fill="none" stroke="#ffffff" stroke-width="3.5"/>
</svg>
